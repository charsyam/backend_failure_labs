spring:
  application:
    name: item-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:db_edu}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:db_edu}
    password: ${DB_PASSWORD:db_edu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${ITEM_SERVICE_PORT:8080}

search-service:
  base-url: ${SEARCH_SERVICE_URL:http://localhost:8081}
